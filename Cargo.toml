[workspace]
resolver = "3"
members = ["precompiles-ed25519"]

[workspace.dependencies]
bobcat-sdk = { version = "0.7.4", features = ["panic-revert"] }

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = "fat"
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
codegen-units = 16
panic = "unwind"
opt-level = "z"
incremental = true
